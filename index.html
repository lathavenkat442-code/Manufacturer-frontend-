    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="application-name" content="Manufacturer">

    <link rel="apple-touch-icon" href="/logo.png" />
    
    <script>
      // Polyfill process for browser environment to prevent 'process is not defined' errors
      if (typeof process === 'undefined') {
        window.process = { env: {} };
      }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@300;400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Mukta Malar', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            overscroll-behavior-y: none; /* Prevents pull-to-refresh on Android wrapper */
        }
        .tamil-font {
            font-family: 'Mukta Malar', sans-serif;
        }
        /* Custom scrollbar for better mobile feel */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        /* Disable text selection for app-like feel */
        * {
            -webkit-touch-callout: none;
        }
        input, textarea {
            -webkit-touch-callout: default;
            user-select: text;
        }
        
        /* Global button touch feedback */
        button, .cursor-pointer {
            -webkit-tap-highlight-color: transparent;
        }
        button:active, .cursor-pointer:active {
            transform: scale(0.96) !important;
            opacity: 0.85 !important;
            transition: transform 0.1s ease-out, opacity 0.1s ease-out !important;
        }

        /* Quick Dark Mode using CSS filters */
        html.dark {
            filter: invert(1) hue-rotate(180deg);
            background-color: #fff; /* Inverts to black */
        }
        html.dark img, html.dark video, html.dark canvas, html.dark .sidebar-container {
            filter: invert(1) hue-rotate(180deg);
        }
        /* Ensure images inside double-inverted containers don't get inverted again */
        html.dark .sidebar-container img {
            filter: none;
        }

        /* Print styling for clean A4 sheet output */
        @media print {
            body, html {
                background: white !important;
                color: black !important;
                margin: 0 !important;
                padding: 0 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            header, aside, nav, .print\:hidden, [class*="print:hidden"] {
                display: none !important;
            }
            @page {
                size: auto;
                margin: 5mm;
            }
            /* Standard tables fit full printable width of page */
            #pdf-supplier-statement,
            #pdf-warper-statement,
            #pdf-warper-statement-container,
            #pdf-warp-order-print-container,
            #warp-order-print-document,
            #pdf-ledger-print-container,
            #pdf-statement-accounting,
            [id^="pdf-loom-statement-"],
            .max-w-4xl,
            .max-w-5xl {
                display: block !important;
                overflow: visible !important;
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
                box-shadow: none !important;
            }
            .overflow-x-auto, .overflow-auto {
                overflow: visible !important;
                display: block !important;
            }
            table {
                width: 100% !important;
                page-break-inside: auto;
                border-collapse: collapse !important;
            }
            tr {
                page-break-inside: avoid;
                page-break-after: auto;
            }
            thead {
                display: table-header-group;
            }
        }
    </style>
